<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Chroma mark: a donut split into proportional arcs (the app's signature
       motif). Violet is the dominant share; teal and amber are harmonious
       hues. Rounded dark plate so it reads in a browser tab at 16px. -->
  <rect width="32" height="32" rx="7" fill="#0B0C11" />
  <g
    fill="none"
    stroke-width="8"
    transform="rotate(-90 16 16)"
    stroke-linecap="butt"
  >
    <!-- violet 50% -->
    <circle cx="16" cy="16" r="10" stroke="#7B6FFE"
      stroke-dasharray="30.4 32.4" stroke-dashoffset="0" />
    <!-- teal 30% -->
    <circle cx="16" cy="16" r="10" stroke="#4DD9D6"
      stroke-dasharray="17.8 45.0" stroke-dashoffset="-31.4" />
    <!-- amber 20% -->
    <circle cx="16" cy="16" r="10" stroke="#F2B441"
      stroke-dasharray="11.6 51.2" stroke-dashoffset="-50.3" />
  </g>
</svg>
