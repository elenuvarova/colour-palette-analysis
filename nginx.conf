server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses / error pages.
    server_tokens off;

    # Recover the real client IP from the upstream proxy (Coolify's Traefik) so
    # per-client rate limiting works (otherwise every request appears to come
    # from Traefik's single internal IP → one shared global bucket). nginx here
    # is only reachable from the Docker network, so trusting the private ranges
    # as proxies is safe; real_ip_recursive walks the X-Forwarded-For chain.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compress text assets. text/html is gzipped by default; everything else
    # (the JS/CSS bundle, SVGs, JSON) needs to be listed explicitly.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/css image/svg+xml application/json application/xml;

    # Security headers. 'always' so they also apply to error (4xx/5xx) responses.
    # CSP allows inline <script> (no-flash theme toggle in index.html) and inline
    # styles; fonts are self-hosted, so no external font/script/style origins.
    # HSTS is safe because Coolify terminates TLS in front of this container.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy API and health check to uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace (don't append) so clients can't spoof their IP in rate limiting
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Long-lived cache for hashed Vite assets.
    # NOTE: any add_header here resets the server-level headers for this
    # location, so the security headers are repeated to keep them applied.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
